<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SOLANO CITY — an open-world crime story</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; display: block; cursor: crosshair; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Segoe UI", Arial, sans-serif; color: #fff; user-select: none;
  }
  #toasts { position: absolute; right: 16px; top: 16px; text-align: right; }
  .toast {
    background: rgba(10, 12, 20, 0.78); border-left: 3px solid #ffd166;
    padding: 8px 14px; margin-bottom: 8px; font-size: 14px; letter-spacing: .3px;
    border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.5);
    opacity: 0; transform: translateX(20px); transition: all .25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="toasts"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
