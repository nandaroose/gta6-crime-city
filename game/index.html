<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Solano City — A Sun-Soaked Crime Saga</title>
  <style>
    :root {
      --gold: #f4c84a;
      --cream: #f1ead8;
      --ink: #0e121a;
      --panel: rgba(12, 18, 24, 0.9);
      --line: rgba(244, 200, 74, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101820;
      color: var(--cream);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #game {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: none;
      background: #17252b;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 12%, rgba(244, 168, 74, 0.14), transparent 46%),
        radial-gradient(circle at 50% 100%, rgba(10, 16, 24, 0.72), transparent 70%),
        rgba(8, 12, 18, 0.52);
      cursor: default;
      overflow-y: auto;
    }
    .overlay.hidden { display: none; }
    .overlay.visible { display: flex; }
    .menu-card {
      position: relative;
      width: min(560px, 94vw);
      padding: 38px 34px 30px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
      overflow: hidden;
      animation: rise 0.28s ease-out both;
    }
    .menu-card.wide { width: min(720px, 94vw); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    .title-card { padding-top: 54px; }
    .sun-disc {
      position: absolute;
      top: -150px;
      left: 50%;
      width: 380px;
      height: 380px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 198, 96, 0.42), rgba(226, 96, 79, 0.18) 48%, transparent 70%);
      pointer-events: none;
    }
    .eyebrow {
      position: relative;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(48px, 8.6vw, 86px);
      line-height: 0.92;
      letter-spacing: 0.06em;
      font-weight: 900;
      color: #f8eccf;
      text-shadow: 0 4px 0 rgba(180, 78, 52, 0.35), 0 18px 48px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin: 0 0 6px;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: 0.03em;
      color: #f8eccf;
    }
    .subtitle {
      margin: 12px 0 0;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(241, 234, 216, 0.72);
    }
    .subtitle.small { font-size: 12px; letter-spacing: 0.14em; }
    .blurb {
      margin: 22px 0 26px;
      font-size: 14px;
      line-height: 1.65;
      color: rgba(241, 234, 216, 0.7);
    }
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(320px, 100%);
      margin: 22px auto 0;
    }
    .menu-buttons.row {
      flex-direction: row;
      justify-content: center;
      width: auto;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(244, 200, 74, 0.24);
      border-radius: 10px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--cream);
      font: 600 15px/1 system-ui, sans-serif;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease, border-color 0.14s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--gold);
      border-color: var(--gold);
      color: #1a1610;
      transform: translateY(-1px);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn.primary {
      background: linear-gradient(180deg, #ffd767, #e8b336);
      border-color: #ffd767;
      color: #241c0d;
      box-shadow: 0 8px 24px rgba(244, 200, 74, 0.18);
    }
    .btn.primary:hover:not(:disabled) { background: #ffe187; }
    .btn.ghost { border-color: rgba(255, 255, 255, 0.12); color: rgba(241, 234, 216, 0.65); }
    .btn.small { padding: 8px 14px; font-size: 13px; }
    .btn:disabled { opacity: 0.32; cursor: not-allowed; }
    .footnote {
      margin-top: 24px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(241, 234, 216, 0.42);
    }
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
      margin: 24px 0 18px;
      text-align: left;
    }
    .control-grid > div {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.025);
    }
    .control-grid span { font-size: 12.5px; color: rgba(241, 234, 216, 0.76); line-height: 1.3; }
    kbd {
      flex: none;
      min-width: 56px;
      padding: 4px 7px;
      border-radius: 6px;
      border: 1px solid rgba(244, 200, 74, 0.3);
      background: rgba(244, 200, 74, 0.1);
      color: var(--gold);
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }
    .hint {
      margin: 4px 0 0;
      font-size: 12px;
      color: rgba(241, 234, 216, 0.48);
    }
    .setting {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 18px 0;
      text-align: left;
      font-size: 14px;
      color: rgba(241, 234, 216, 0.86);
    }
    .setting span { display: flex; justify-content: space-between; }
    .setting b { color: var(--gold); font-weight: 700; }
    .setting input[type="range"] { width: 100%; accent-color: var(--gold); }
    .setting.check {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
    }
    .setting.check input { width: 18px; height: 18px; accent-color: var(--gold); }
    .slots { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 4px; }
    .slot {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.025);
      text-align: left;
    }
    .slot-name { width: 78px; flex: none; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
    .slot-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .slot-info b { font-size: 14px; color: #f6efdd; }
    .slot-info span { font-size: 11.5px; color: rgba(241, 234, 216, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 620px) {
      .control-grid { grid-template-columns: 1fr; }
      .menu-card { padding: 28px 20px 22px; }
      .slot { flex-wrap: wrap; }
      .slot-name { width: auto; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="overlay" class="overlay hidden"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
